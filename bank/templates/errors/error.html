{% extends "base.html" if current_user.is_authenticated else "auth/layout.html" %}
{% block title %}{{ title }}{% endblock %}
{% block content %}
<div class="card"><div class="card-body center">
  <h1>{{ code }} · {{ title }}</h1>
  <p class="muted mt">{{ message }}</p>
  <a class="btn primary mt" href="{{ url_for('dashboard.index') }}">Back to dashboard</a>
</div></div>
{% endblock %}
