# Production-like stack: HTTPS reverse proxy + 2 app servers + PostgreSQL + Redis + scheduler.
#   docker compose -f deploy/docker-compose.prod.yml --env-file deploy/.env.prod up -d --build
# Secrets come from deploy/.env.prod (git-ignored; create from deploy/env.prod.example).
name: localbank-prod

x-app: &app
  image: localbank-ops:latest          # built once by the migrate service
  restart: unless-stopped
  environment:
    BANK_ENV: production
    BANK_HTTPS: "1"
    BANK_TRUSTED_PROXIES: "1"          # exactly one proxy (Caddy) in front
    BANK_INPROCESS_SCAN: "0"           # the scheduler service runs the scan
    DATABASE_URL: postgresql+psycopg://bank_app:${BANK_APP_DB_PASSWORD}@db:5432/bankdb
    REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
    BANK_SECRET_KEY: ${BANK_SECRET_KEY}
    BANK_DATA_KEY: ${BANK_DATA_KEY}
    BANK_ADMIN_EMAIL: ${BANK_ADMIN_EMAIL}
    BANK_EXPOSE_INSTANCE: ${BANK_EXPOSE_INSTANCE:-0}
  volumes: [uploads:/data/uploads]
  networks: [backend]
  depends_on:
    migrate: { condition: service_completed_successfully }
    redis: { condition: service_healthy }

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: bankowner
      POSTGRES_PASSWORD: ${DB_OWNER_PASSWORD}
      POSTGRES_DB: bankdb
      POSTGRES_INITDB_ARGS: "--auth-host=scram-sha-256"
    volumes: [pgdata:/var/lib/postgresql/data]
    networks: [backend]                  # not published to the host
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bankowner -d bankdb"]
      interval: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}", "--appendonly", "yes"]
    volumes: [redisdata:/data]
    networks: [backend]
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$${REDIS_PASSWORD}\" ping | grep PONG"]
      interval: 5s
      retries: 20
    environment: { REDIS_PASSWORD: "${REDIS_PASSWORD}" }

  migrate:                               # one-shot: role, migrations, reference data
    image: localbank-ops:latest
    build: { context: .., dockerfile: Dockerfile }
    command: ["flask", "--app", "wsgi:app", "prepare-db"]
    environment:
      BANK_ENV: development               # owner connection only; runs once and exits
      BANK_DB_OWNER_URL: postgresql+psycopg://bankowner:${DB_OWNER_PASSWORD}@db:5432/bankdb
      BANK_APP_DB_PASSWORD: ${BANK_APP_DB_PASSWORD}
      DATABASE_URL: postgresql+psycopg://bankowner:${DB_OWNER_PASSWORD}@db:5432/bankdb
      BANK_SECRET_KEY: ${BANK_SECRET_KEY}
      BANK_DATA_KEY: ${BANK_DATA_KEY}
      BANK_ADMIN_EMAIL: ${BANK_ADMIN_EMAIL}
      BANK_ADMIN_PASSWORD: ${BANK_ADMIN_PASSWORD}
    networks: [backend]
    depends_on: { db: { condition: service_healthy } }
    restart: "no"

  app1: *app
  app2: *app

  scheduler:                             # overdue / expiry / FD maturity / audit sealing
    <<: *app
    command: ["sh", "-c", "while true; do flask --app wsgi:app scan; sleep 300; done"]
    healthcheck: { disable: true }

  proxy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports: ["8443:443"]
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddydata:/data
    networks: [backend]
    depends_on: [app1, app2]

networks:
  backend: {}

volumes:
  pgdata: {}
  redisdata: {}
  uploads: {}
  caddydata: {}
