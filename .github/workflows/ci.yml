name: ci
on: [push, pull_request]
permissions: { contents: read }

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env: { POSTGRES_USER: bankapp, POSTGRES_PASSWORD: ci-only-owner, POSTGRES_DB: bankdb }
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U bankapp" --health-interval 5s --health-retries 20
    env:
      # Throwaway CI-only values; real secrets never live in the repository.
      BANK_DB_OWNER_URL: postgresql+psycopg://bankapp:ci-only-owner@127.0.0.1:5432/bankdb
      BANK_APP_DB_PASSWORD: ci-only-app
      DATABASE_URL: postgresql+psycopg://bank_app:ci-only-app@127.0.0.1:5432/bankdb
      BANK_SECRET_KEY: ci-only-secret-key-0123456789abcdef0123456789abcdef
      BANK_DATA_KEY: ZmFrZS1jaS1rZXktMzItYnl0ZXMtbG9uZy0xMjM0NTY=
      BANK_ADMIN_EMAIL: rajnath080703@gmail.com
      BANK_ADMIN_PASSWORD: Ci-Only#Admin2026
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.13", cache: pip }
      - run: pip install -r requirements.txt coverage ruff bandit pip-audit requests
      - name: Lint
        run: ruff check bank --select F,E9,B,S
      - name: Static security scan
        run: bandit -r bank -q
      - name: Dependency vulnerabilities
        run: pip-audit -r requirements.txt
      - name: Migrations have no pending model changes
        run: |
          python -c "from bank.bootstrap import prepare_database; prepare_database()"
          DATABASE_URL=$BANK_DB_OWNER_URL flask --app wsgi:app db check
      - name: All test suites with coverage
        run: python tests/run_all.py
